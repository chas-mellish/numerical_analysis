[project]
name = "gerald-na"
version = "0.1.0"
description = "Python port and web learning tool for the FORTRAN programs of C. F. Gerald, Applied Numerical Analysis"
requires-python = ">=3.14"
authors = [{ name = "numerical_analysis contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Education",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-multipart>=0.0.18",
    "markdown-it-py>=3",
]

[project.scripts]
gerald-na = "gerald_na.cli:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=6",
    "hypothesis>=6",
    "numpy>=2",
    "scipy>=1.14",
    "httpx2>=2.16",  # TestClient transport (starlette deprecated plain httpx)
    "ruff>=0.8",
    "mypy>=1.13",
    "playwright>=1.49",
    "pytest-playwright>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gerald_na"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "S",   # flake8-bandit (security)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest checks

[tool.ruff.lint.isort]
known-first-party = ["gerald_na"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# Browser tests are opt-in: `pytest -m e2e` (a later -m on the command line wins).
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not e2e"]
markers = [
    "fortran: needs the compiled Fortran drivers (run `make build-fortran`); skipped when absent",
    "e2e: Playwright browser tests against a live server (run with `pytest -m e2e`)",
    "slow: long-running tests",
]
xfail_strict = true

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["gerald_na.algorithms", "gerald_na.expr"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
