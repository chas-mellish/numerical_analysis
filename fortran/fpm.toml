# Modern Fortran 2018 track of the Gerald "Applied Numerical Analysis" programs.
#
# Compiler flags are not hard-coded here: the top-level Makefile passes them through
# `fpm --flag` so the same manifest works for gfortran (strict, warning-free) and
# LLVM flang. See ../Makefile (FC, FFLAGS, FPMFLAGS) and ../docs/architecture.md.
#
#   make build-fortran         # gfortran, real64, installed to ../build/bin
#   make build-fortran-single  # gfortran, -DSINGLE (real32), installed to ../build/single/bin
#   make test-fortran          # fpm test (test-drive)
#   make test-fortran-flang    # fpm test with LLVM flang
name = "gerald_na_fortran"
version = "0.1.0"
description = "Fortran 2018 modernization of the FORTRAN listings in C. F. Gerald, Applied Numerical Analysis"

[build]
auto-executables = true
auto-tests = true
auto-examples = false
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

# Enables the C preprocessor so `-DSINGLE` selects real32 working precision in precision.F90.
[preprocess]
[preprocess.cpp]

[install]
library = false

[dev-dependencies]
test-drive = { git = "https://github.com/fortran-lang/test-drive", tag = "v0.5.0" }
